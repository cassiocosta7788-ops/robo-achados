<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#ffe600"> <title>Robô Achados - Mercado Livre</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #f3f4f8; color: #252525; } header { background: #ffe600; text-align: center; padding: 34px 15px 42px; } header h1 { font-size: clamp(28px, 6vw, 44px); margin: 0 0 24px; } header p { margin: 0; font-size: clamp(17px, 4vw, 25px); } main { width: min(1100px, 100%); margin: 30px auto; padding: 0 16px; } .search { display: flex; gap: 12px; margin-bottom: 25px; } input { flex: 1; min-width: 0; padding: 17px; border: 1px solid #d3d3d3; border-radius: 12px; font-size: 18px; background: white; } button { border: 0; border-radius: 10px; background: #3483fa; color: white; padding: 15px 22px; font-size: 17px; cursor: pointer; } button:disabled { opacity: .6; cursor: wait; } #mensagem { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 16px; line-height: 1.6; margin: 18px 0; } .erro { color: #b42318; } .info { color: #555; } .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; margin-top: 22px; } .produto { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px #00000012; display: flex; flex-direction: column; gap: 10px; min-width: 0; } .produto img { width: 100%; height: 190px; object-fit: contain; } .produto h2 { font-size: 16px; line-height: 1.4; margin: 0; overflow-wrap: anywhere; } .preco { font-size: 24px; font-weight: bold; } .detalhe { font-size: 14px; color: #555; line-height: 1.5; } .produto a { display: block; text-align: center; text-decoration: none; background: #3483fa; color: white; border-radius: 8px; padding: 12px; margin-top: auto; } footer { text-align: center; color: #666; font-size: 14px; line-height: 1.5; padding: 30px 18px; } @media (max-width: 480px) { .search { gap: 8px; } input { padding: 14px 12px; font-size: 16px; } button { padding: 13px 15px; font-size: 16px; } .grade { grid-template-columns: 1fr; } } </style> </head> <body> <header> <h1>🛍️ Robô Achados</h1> <p>Pesquise produtos do Mercado Livre</p> </header> <main> <form class="search" id="formBusca"> <input id="pesquisa" type="search" placeholder="Ex.: celular Samsung" aria-label="Produto para pesquisar" required > <button id="botaoBuscar" type="submit">Buscar</button> </form> <div id="mensagem" role="status" aria-live="polite"></div> <section id="resultados" class="grade"></section> </main> <footer> Preços e informações fornecidos pelos anúncios consultados. Este site não é afiliado ao Mercado Livre. </footer> <script> const form = document.getElementById("formBusca"); const campo = document.getElementById("pesquisa"); const botao = document.getElementById("botaoBuscar"); const mensagem = document.getElementById("mensagem"); const resultados = document.getElementById("resultados"); function mostrarMensagem(texto, erro = false) { mensagem.textContent = texto; mensagem.className = erro ? "erro" : "info"; } function formatarPreco(valor, moeda) { return new Intl.NumberFormat("pt-BR", { style: "currency", currency: moeda || "BRL" }).format(Number(valor) || 0); } function criarProduto(produto) { const card = document.createElement("article"); card.className = "produto"; const imagem = document.createElement("img"); imagem.src = produto.thumbnail || ""; imagem.alt = produto.title || "Produto"; imagem.loading = "lazy"; imagem.onerror = () => { imagem.style.display = "none"; }; const titulo = document.createElement("h2"); titulo.textContent = produto.title || "Produto sem título"; const preco = document.createElement("div"); preco.className = "preco"; preco.textContent = formatarPreco( produto.price, produto.currency_id ); const detalhe = document.createElement("div"); detalhe.className = "detalhe"; const condicao = produto.condition === "new" ? "Novo" : produto.condition === "used" ? "Usado" : "Não informada"; detalhe.textContent = "Condição: " + condicao + (Number.isFinite(Number(produto.sold_quantity)) ? "\nVendas informadas: " + produto.sold_quantity : ""); const link = document.createElement("a"); link.href = produto.permalink || "#"; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = "Ver anúncio"; card.append(imagem, titulo, preco, detalhe, link); return card; } form.addEventListener("submit", async (evento) => { evento.preventDefault(); const termo = campo.value.trim(); if (!termo) { mostrarMensagem("Digite o nome de um produto.", true); return; } resultados.replaceChildren(); mostrarMensagem("Pesquisando produtos..."); botao.disabled = true; botao.textContent = "Buscando..."; try { const resposta = await fetch( "/api/buscar?q=" + encodeURIComponent(termo) ); const texto = await resposta.text(); let dados; try { dados = JSON.parse(texto); } catch { throw new Error( "O servidor retornou uma resposta inválida. " + "Confira o deploy e a rota /api/buscar." ); } if (!resposta.ok) { const detalhe = dados.detalhe ? "\nDetalhe: " + dados.detalhe : ""; const status = dados.status || resposta.status; throw new Error( (dados.erro || "A busca falhou.") + "\nCódigo HTTP: " + status + detalhe ); } const produtos = Array.isArray(dados.produtos) ? dados.produtos : []; if (produtos.length === 0) { mostrarMensagem("Nenhum produto encontrado."); return; } mostrarMensagem( produtos.length + " produtos encontrados." ); const fragmento = document.createDocumentFragment(); produtos.forEach((produto) => { fragmento.appendChild(criarProduto(produto)); }); resultados.appendChild(fragmento); } catch (erro) { mostrarMensagem( "Não foi possível concluir a busca.\n" + (erro.message || "Erro desconhecido."), true ); } finally { botao.disabled = false; botao.textContent = "Buscar"; } }); </script> </body> </html>
