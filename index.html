<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Mais Vendidos - Mercado Livre</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: Arial, sans-serif; background: #f4f5f8; color: #222; } header { background: #ffe600; padding: 24px 16px; text-align: center; } header h1 { margin: 0 0 8px; color: #222; font-size: 27px; } header p { margin: 0; } main { max-width: 1100px; margin: auto; padding: 20px 14px; } .busca { display: flex; gap: 8px; margin-bottom: 15px; } input { flex: 1; min-width: 0; padding: 14px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; } button { padding: 13px 18px; background: #3483fa; color: white; border: none; border-radius: 7px; font-size: 15px; cursor: pointer; } button:disabled { opacity: 0.6; cursor: wait; } #status { margin: 16px 0; color: #555; line-height: 1.5; } #produtos { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 14px; } .produto { background: white; border: 1px solid #e2e2e2; border-radius: 9px; padding: 13px; display: flex; flex-direction: column; min-width: 0; } .produto img { width: 100%; height: 155px; object-fit: contain; margin-bottom: 12px; } .produto h2 { font-size: 14px; line-height: 1.4; font-weight: normal; margin: 0 0 10px; } .preco { color: #00834b; font-size: 20px; font-weight: bold; margin: 5px 0 10px; } .info { color: #666; font-size: 12px; line-height: 1.6; margin-bottom: 12px; } .produto a { display: block; margin-top: auto; text-decoration: none; text-align: center; background: #3483fa; color: white; border-radius: 6px; padding: 11px 5px; font-size: 14px; } .produto a:hover { background: #2968c8; } footer { text-align: center; padding: 24px 12px; color: #666; font-size: 12px; } @media (max-width: 380px) { #produtos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .produto { padding: 9px; } .produto img { height: 120px; } .busca button { padding: 12px; } } </style> </head> <body> <header> <h1>🛍️ Mercado Livre</h1> <p>Encontre produtos, preços e detalhes dos anúncios.</p> </header> <main> <form class="busca" id="formBusca"> <input id="pesquisa" type="search" placeholder="Ex.: celular Samsung" aria-label="Buscar produtos" required > <button id="btnBuscar" type="submit">Buscar</button> </form> <div id="status" role="status"> Carregando produtos populares... </div> <section id="produtos" aria-label="Resultados dos produtos"></section> </main> <footer> Dados consultados na API pública do Mercado Livre. Este site de teste não é afiliado ao Mercado Livre. </footer> <script> const API = "https://api.mercadolibre.com"; const lista = document.getElementById("produtos"); const status = document.getElementById("status"); const formulario = document.getElementById("formBusca"); const campo = document.getElementById("pesquisa"); const botao = document.getElementById("btnBuscar"); function dinheiro(valor) { return Number(valor || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); } function criarElemento(tag, classe, texto) { const el = document.createElement(tag); if (classe) el.className = classe; if (texto !== undefined) el.textContent = texto; return el; } function mostrarProdutos(produtos) { lista.replaceChildren(); if (!produtos || produtos.length === 0) { status.textContent = "Nenhum produto encontrado."; return; } status.textContent = produtos.length + " produtos encontrados. Consulte os detalhes de cada anúncio."; produtos.forEach(produto => { const card = criarElemento("article", "produto"); const imagem = document.createElement("img"); imagem.src = produto.thumbnail || ""; imagem.alt = produto.title || "Produto"; imagem.loading = "lazy"; imagem.onerror = () => { imagem.style.visibility = "hidden"; }; const nome = criarElemento("h2", "", produto.title || "Produto"); const preco = criarElemento("div", "preco", dinheiro(produto.price)); const informacoes = criarElemento("div", "info"); informacoes.textContent = "Condição: " + (produto.condition === "new" ? "Novo" : produto.condition === "used" ? "Usado" : "Não informada"); if (Number.isFinite(produto.sold_quantity)) { informacoes.textContent += "\nVendas informadas: " + produto.sold_quantity; informacoes.style.whiteSpace = "pre-line"; } const link = document.createElement("a"); link.href = produto.permalink; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = "Ver detalhes"; card.append(imagem, nome, preco, informacoes, link); lista.appendChild(card); }); } async function buscarProdutos(termo) { botao.disabled = true; lista.replaceChildren(); status.textContent = "Buscando produtos..."; try { const url = new URL(API + "/sites/MLB/search"); url.searchParams.set("q", termo); url.searchParams.set("limit", "24"); const resposta = await fetch(url); if (!resposta.ok) { throw new Error("A API respondeu com erro HTTP " + resposta.status); } const dados = await resposta.json(); mostrarProdutos(dados.results || []); } catch (erro) { console.error("Erro na busca:", erro); status.textContent = "Não foi possível consultar a API diretamente pelo navegador. " + "Pode ser uma restrição de acesso ou conexão. " + "Se acontecer, vamos testar a API por um servidor."; } finally { botao.disabled = false; } } formulario.addEventListener("submit", evento => { evento.preventDefault(); const termo = campo.value.trim(); if (termo) { buscarProdutos(termo); } }); // Primeira busca automática buscarProdutos("mais vendidos"); </script> </body> </html>
